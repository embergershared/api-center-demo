name: api-center-demo
metadata:
  template: azure-azd-starter@0.2.0
infra:
  provider: bicep
  path: infra
  module: main
services:
  grid-telemetry-api:
    project: src/GridTelemetry.Api
    host: containerapp
    language: dotnet
    resourceName: ${GRID_API_APP_NAME}
  grid-tools-mcp:
    project: src/GridTools.Mcp
    host: containerapp
    language: dotnet
    resourceName: ${GRID_MCP_APP_NAME}
hooks:
  preprovision:
    shell: pwsh
    continueOnError: false
    run: |
      ./scripts/set-deployment-tags.ps1
      ./scripts/preflight.ps1
  postprovision:
    shell: pwsh
    continueOnError: false
    run: |
      $ErrorActionPreference = 'Stop'
      ./scripts/provision-catalog.ps1
      ./scripts/05-link-apim.ps1
